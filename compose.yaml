name: leafnote
services:
  leafnote:
    build: .
    image: leafnote-local:1.4.1
    depends_on:
      sync:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${LEAFNOTE_BIND_IP:-0.0.0.0}:${LEAFNOTE_HTTPS_PORT:-8443}:8443"
    environment:
      LEAFNOTE_HOST: "${LEAFNOTE_HOST:-localhost}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  sync:
    build:
      context: .
      dockerfile: Dockerfile.sync
    image: leafnote-sync:1.4.1
    user: "${LEAFNOTE_SYNC_UID:-1000}:${LEAFNOTE_SYNC_GID:-1000}"
    restart: unless-stopped
    environment:
      LEAFNOTE_SYNC_ROOT: /sync
      LEAFNOTE_SYNC_FOLDER: "${LEAFNOTE_SYNC_DIR}"
    volumes:
      - type: bind
        source: "${LEAFNOTE_SYNC_DIR:?Run scripts/configure-sync.sh to choose a storage folder}"
        target: /sync
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  caddy_data:
  caddy_config:
